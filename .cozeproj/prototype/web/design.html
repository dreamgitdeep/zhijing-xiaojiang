  <style type="text/tailwindcss">
    @theme {
      --color-primary:              #2F7A4F;
      --color-primary-container:    #E3F0E8;
      --color-on-primary:           #ffffff;
      --color-on-primary-container: #1B4D31;
      --color-background:                 #F7FAF8;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #EDF3EF;
      --color-surface-container-high:     #E2EBE5;
      --color-surface-container-highest:  #D7E2DA;
      --color-on-surface:           #1C2B22;
      --color-on-surface-variant:   #5C6E63;
      --color-success:  #2AA05A;
      --color-error:    #C0392B;
      --color-warning:  #D97706;
      --color-info:     #2563EB;
      --color-outline:          #C2CFC6;
      --color-outline-variant:  #DCE5DF;
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      --shadow-card:   0 1px 3px rgba(28,43,34,0.10), 0 1px 2px rgba(28,43,34,0.06);
      --shadow-float:  0 10px 25px rgba(28,43,34,0.14);
      --shadow-dialog: 0 25px 50px rgba(28,43,34,0.18);
      --font-sans:  "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-latin: "Playfair Display", Georgia, serif;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

      <nav class="hidden md:flex items-center gap-1">

      </nav>
      <div class="flex items-center gap-3">

          <i data-lucide="book-check" class="w-4 h-4"></i>
          <span>已掌握 12/124</span>
        </div>

          <button class="w-9 h-9 rounded-full bg-primary text-on-primary text-sm font-semibold flex items-center justify-center" aria-label="用户菜单">初</button>

  <!-- @main-content:start -->

    </div>

    <div class="relative rounded-xl overflow-hidden h-48 mt-10">
      <img src="https://coze-coding-project.tos.coze.site/coze_storage_7685176549548720154/image/generate_image_23ac3ad3-a594-4206-8392-6d57986e9768.jpeg?sign=1820890857-90db6e4934-0-28de16db8e60b7430b2f5aece55516978816b42c97ca34123fd82cd541757b37" alt="繁花植物造景效果预览" data-category="自然风景" class="w-full h-full object-cover opacity-70">
